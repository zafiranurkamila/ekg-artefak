name: Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Lengkapi folder web
        run: flutter create --platforms=web --project-name ekg_artefak .
      - run: flutter pub get
      - name: Build web
        shell: bash
        run: |
          set -o pipefail
          flutter build web --release --pwa-strategy=none --base-href /${{ github.event.repository.name }}/ 2>&1 | tee build.log || {
            grep -E "rror|\.dart:[0-9]+" build.log | head -25 | while read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Beri nomor versi pada file JS agar browser tidak memakai cache lama
        shell: bash
        run: |
          V=${GITHUB_SHA::7}
          sed -i "s#main.dart.js#main.dart.js?v=$V#g" build/web/flutter_bootstrap.js
          sed -i "s#flutter_bootstrap.js#flutter_bootstrap.js?v=$V#g" build/web/index.html
          grep -c "v=$V" build/web/flutter_bootstrap.js build/web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
      - run: echo "Buka di HP -> ${{ steps.d.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
